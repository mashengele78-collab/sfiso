[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbcli"
version = "0.1.0"
description = "Command-line client for the Facebook Graph API (Pages, posts, comments, insights)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Repository owner"}]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
fbcli = "fbcli.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/fbcli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
